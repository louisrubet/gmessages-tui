# Packages of gmessages-tui v1.3.3, built with multi-distro-packager
# (https://github.com/louisrubet/multi-distro-packager):
#
#   cd packaging && ~/Development/multi-distro-packager/mdpack.py v1.3.3.yaml

distro: [ubuntu:24.04, ubuntu:22.04, fedora:44, fedora:43, archlinux:latest]

app:
  source:
    type: git
    url: https://github.com/louisrubet/gmessages-tui.git
    tag: v1.3.3
    commit: 21d876b7e82fe36bab12c7d7430af13fd7964bad
  build:
    type: cargo
    cargo_options: [--locked]
    cargo_bins: [gmessages-tui]
    files:
      - LICENSE:/usr/share/licenses/gmessages-tui/LICENSE
      - README.md:/usr/share/doc/gmessages-tui/README.md
    deps: []
    ubuntu_deps: [curl, ca-certificates, git, pkg-config, libssl-dev, libgtk-3-dev, libwebkit2gtk-4.1-dev, libdbus-1-dev]
    fedora_deps: [curl, git, perl, openssl-devel, gtk3-devel, webkit2gtk4.1-devel, dbus-devel]
    archlinux_deps: [curl, openssl, gtk3, webkit2gtk-4.1, dbus]

pkg:
  package: gmessages-tui
  version: 1.3.3
  release: 1
  license: AGPL-3.0-only
  summary: Google Messages (RCS and SMS) in the terminal
  description: A terminal client for Google Messages, paired with your Android phone like Google Messages for web. Not affiliated with Google.
  maintainer: Louis Rubet <louis@rubet.fr>
  homepage: https://github.com/louisrubet/gmessages-tui
  section: net
  deps: ''
  ubuntu_24.04_deps: libssl3t64, libgtk-3-0t64, libwebkit2gtk-4.1-0, libdbus-1-3
  ubuntu_22.04_deps: libssl3, libgtk-3-0, libwebkit2gtk-4.1-0, libdbus-1-3
  fedora_deps: openssl-libs, gtk3, webkit2gtk4.1, dbus-libs
  archlinux_deps: openssl, gtk3, webkit2gtk-4.1, dbus

test:
  command: gmessages-tui --version
