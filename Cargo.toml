[package]
name = "gmessages-tui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A terminal client for Google Messages (RCS/SMS). Not affiliated with Google."
repository = "https://github.com/louisrubet/gmessages-tui"
build = "build.rs"
# gmd/ is the Go source of the embedded gmd: not part of the crate.
exclude = ["gmd/*.go", "gmd/go.*", "gmd/dist"]

[dependencies]
# The interface, shared with signal-tui.
chat-tui = { git = "https://github.com/louisrubet/chat-tui", tag = "v1.2.0" }
chrono = "0.4"
crossterm = "0.28"
base64 = "0.22"
futures = "0.3"
getrandom = "0.3"
# The store: SQLCipher (with the system OpenSSL), its key in the OS keyring, a passphrase
# prompt as a fallback.
keyring = "4.2"
rpassword = "7.5"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native sign-in and the diagnostic example.
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
tokio = { version = "1.48", features = ["macros", "rt", "time", "process", "io-util", "net", "signal"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["wry-signin"]
# Needs WebKitGTK on Linux (Fedora: webkit2gtk4.1-devel).
wry-signin = ["dep:tao", "dep:wry"]

[[example]]
name = "wry_signin"
required-features = ["wry-signin"]

[build-dependencies]
sha2 = "0.10"
ureq = "3"
