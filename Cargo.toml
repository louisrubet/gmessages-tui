[package]
name = "gmessages-tui"
version = "1.3.1"
edition = "2024"
license = "AGPL-3.0-only"
description = "Google Messages (RCS and SMS) in your terminal, paired with your Android phone. Not affiliated with Google."
repository = "https://github.com/louisrubet/gmessages-tui"
readme = "README.md"
keywords = ["google-messages", "rcs", "sms", "tui", "terminal"]
categories = ["command-line-utilities"]
build = "build.rs"
include = ["/src", "/build.rs", "/examples/wry_signin.rs", "/README.md", "/LICENSE"]

[workspace]
members = ["gmessages-proto"]

[dependencies]
# The interface, shared with signal-tui.
chat-tui = { package = "chat-tui-core", git = "https://github.com/louisrubet/chat-tui-core", tag = "v1.11.1", version = "1.11.1" }
chrono = "0.4"
crossterm = "0.28"
base64 = "0.22"
futures = "0.3"
getrandom = "0.3"
# Google Messages for web: the protocol.
gmessages-proto = { path = "gmessages-proto", version = "0.1.0" }
# The store: SQLCipher (with the system OpenSSL), its key in the OS keyring, a passphrase
# prompt as a fallback.
keyring = "4.2"
rpassword = "7.5"
rusqlite = { version = "0.40", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Native sign-in and the diagnostic example.
tao = { version = "0.37", optional = true }
wry = { version = "0.57", optional = true }
tokio = { version = "1.48", features = ["macros", "rt", "time", "net", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
default = ["wry-signin"]
# Needs WebKitGTK on Linux (Fedora: webkit2gtk4.1-devel).
wry-signin = ["dep:tao", "dep:wry"]

[[example]]
name = "wry_signin"
required-features = ["wry-signin"]
