[package]
name = "gmessages-tui"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "A terminal client for Google Messages (RCS/SMS). Not affiliated with Google."
repository = "https://github.com/louisrubet/gmessages-tui"
build = "build.rs"
# gmd/ is the Go source of the embedded gmd: not part of the crate.
exclude = ["gmd/*.go", "gmd/go.*", "gmd/dist"]

[dependencies]
# The interface, shared with signal-tui.
chat-tui = { git = "https://github.com/louisrubet/chat-tui", tag = "v1.0.0" }
chrono = "0.4"
crossterm = "0.28"
futures = "0.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", features = ["macros", "rt", "time", "process", "io-util", "net"] }

[build-dependencies]
sha2 = "0.10"
ureq = "3"
