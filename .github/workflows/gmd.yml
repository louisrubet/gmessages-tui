# Builds gmd for every target and publishes it, on a `gmd-v*` tag: the release that
# build.rs downloads. Then copy its release.txt to gmd/release.txt and commit it:
#
#   gh release download gmd-vX.Y.Z -p release.txt -O gmd/release.txt --clobber
name: gmd

on:
  push:
    tags: ["gmd-v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gmd/go.mod
          cache-dependency-path: gmd/go.sum
      - name: Build
        run: gmd/build.sh "$GITHUB_REF_NAME"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" gmd/dist/* gmd/release.txt --title "$GITHUB_REF_NAME" --notes "gmd binaries embedded by gmessages-tui; SHA-256 in gmd/release.txt."
