[package]
name = "gmessages-proto"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Louis Rubet"]
description = "Client library for the Google Messages for web protocol, implemented from a written specification"
readme = "README.md"
keywords = ["google-messages", "sms", "rcs", "client"]
categories = ["api-bindings", "network-programming"]

[lib]
name = "gmessages_proto"

[dependencies]
tokio = { version = "1.40", features = ["rt", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "gzip", "deflate", "brotli"] }
prost = "0.14"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
aes = "0.8"
ctr = "0.9"
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
rand = "0.8"
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"

[dev-dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
